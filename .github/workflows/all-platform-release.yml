name: All Platform Release
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/all-platform-release.yml
  workflow_dispatch: null
concurrency:
  group: all-platform-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: 'true'
  CARGO_TERM_COLOR: always
jobs:
  windows:
    name: Windows (setup + portable)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Read version
      id: ver
      shell: bash
      run: |
        V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
        echo "version=$V" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
      continue-on-error: true
      timeout-minutes: 8
      with:
        workspaces: src-tauri -> target
        cache-on-failure: true
    - run: pnpm install --frozen-lockfile
    - name: 构建（NSIS 安装包）
      run: pnpm tauri build --bundles nsis
    - name: 收集产物（安装包 + 便携包）
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        New-Item -ItemType Directory -Force artifacts | Out-Null
        Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "artifacts/HGhubX_${v}_x64_setup.exe"
        $bin = "src-tauri/target/release/hghubx.exe"
        if (-not (Test-Path $bin)) {
          $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Select-Object -First 1).FullName
        }
        Copy-Item $bin "artifacts/HGhubX.exe"
        Copy-Item LICENSE "artifacts/LICENSE.txt"
                  Compress-Archive -Path "artifacts/HGhubX.exe", "artifacts/LICENSE.txt" -DestinationPath "artifacts/HGhubX_${v}_x64_portable.zip" -Force
        Remove-Item "artifacts/HGhubX.exe"
        Get-ChildItem artifacts | Select-Object Name, Length
    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: artifacts/*
        if-no-files-found: error
  macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Read version
      id: ver
      shell: bash
      run: |
        V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
        echo "version=$V" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin,x86_64-apple-darwin
    - uses: swatinem/rust-cache@v2
      continue-on-error: true
      timeout-minutes: 8
      with:
        workspaces: src-tauri -> target
        key: macos
        cache-on-failure: true
    - run: pnpm install --frozen-lockfile
    - name: 构建（Universal dmg）
      run: pnpm tauri build --target universal-apple-darwin
    - name: 收集产物
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts
        cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "artifacts/HGhubX_${{ steps.ver.outputs.version }}_universal.dmg"
        hdiutil verify artifacts/*.dmg
    - uses: actions/upload-artifact@v4
      with:
        name: macos
        path: artifacts/*
        if-no-files-found: error
  linux:
    name: Linux (deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Read version
      id: ver
      shell: bash
      run: |
        V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
        echo "version=$V" >> "$GITHUB_OUTPUT"
    - name: 安装系统依赖
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
          librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
      continue-on-error: true
      timeout-minutes: 8
      with:
        workspaces: src-tauri -> target
        key: linux
        cache-on-failure: true
    - run: pnpm install --frozen-lockfile
    - name: 构建（deb）
      run: pnpm tauri build
    - name: 收集产物
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts
        cp src-tauri/target/release/bundle/deb/*.deb "artifacts/HGhubX_${{ steps.ver.outputs.version }}_amd64.deb"
        ls -lh artifacts

        dpkg-deb --info artifacts/*.deb
    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: artifacts/*
        if-no-files-found: error
  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_DEVELOPMENT_TEAM: ABCDE12345
    steps:
    - uses: actions/checkout@v4
    - name: Read version
      id: ver
      shell: bash
      run: |
        V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
        echo "version=$V" >> "$GITHUB_OUTPUT"
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim
    - uses: swatinem/rust-cache@v2
      continue-on-error: true
      timeout-minutes: 8
      with:
        workspaces: src-tauri -> target
        key: ios
        cache-on-failure: true
    - run: pnpm install --frozen-lockfile
    - name: 生成 iOS 工程（带横竖屏 + ATS）
      run: |
        pnpm tauri ios init --ci
        for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
          for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
            /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
            /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
            /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
          done
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
        done
    - name: 构建并打包 ipa
      shell: bash
      env:
        APP_VERSION: ${{ steps.ver.outputs.version }}
      run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"
    - uses: actions/upload-artifact@v4
      with:
        name: ios
        path: artifacts/*
        if-no-files-found: error
  android:
    name: Build and publish Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android and native build tools
      shell: bash
      run: |
        set -euo pipefail
        SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKM" --licenses > /dev/null 2>&1 || true
        "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
        echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri -> target
        key: android-arm64
        cache-on-failure: true
    - run: pnpm install --frozen-lockfile
    - name: Initialize Android project
      run: pnpm tauri android init --ci
    - name: Build release APK
      run: pnpm tauri android build --apk --target aarch64 --ci
    - name: Sign and verify APK
      id: apk
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        KS="$RUNNER_TEMP/android-release.keystore"
        if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KS"
          SIGNING="release"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
        else
          SIGNING="test"
          KEY_ALIAS=androiddebugkey
          STORE_PASSWORD=android
          KEY_PASSWORD=android
          keytool -genkeypair -noprompt -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -dname "CN=HGhubX CI Test,O=HGhubX,C=CN" -keyalg RSA -keysize 2048 -validity 10000
        fi
        trap 'rm -f "$KS"' EXIT
        export STORE_PASSWORD KEY_PASSWORD
        VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json')).version")"
        APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
        test -n "$APK"
        mkdir -p artifacts
        cp LICENSE artifacts/LICENSE.txt
        OUT="artifacts/HGhubX_${VERSION}_arm64-v8a_${SIGNING}.apk"
        BT="$ANDROID_HOME/build-tools/36.0.0"
        "$BT/zipalign" -f -P 16 4 "$APK" "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false --out "$OUT" "$RUNNER_TEMP/aligned.apk"
        "$BT/apksigner" verify --verbose --print-certs "$OUT"
        "$BT/zipalign" -c -P 16 4 "$OUT"
        "$BT/aapt" dump badging "$OUT" > "$RUNNER_TEMP/apk-badging.txt"
        head -n 5 "$RUNNER_TEMP/apk-badging.txt"
        (cd artifacts && sha256sum *.apk > SHA256SUMS-android.txt)
        echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: android
        path: artifacts/*
        if-no-files-found: error
  publish:
    name: Publish all platform packages
    needs:
    - windows
    - macos
    - linux
    - ios
    - android
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Create checksums and release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RESULTS_JSON: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
        TAG="multiplatform-v${V}-build.${GITHUB_RUN_NUMBER}"
        cp LICENSE artifacts/LICENSE.txt
        (cd artifacts && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
        python3 - <<'NOTES'
        import json,os
        from pathlib import Path
        results=json.loads(os.environ['RESULTS_JSON'])
        lines=['HGhubX 全平台源码编译版。','', '| 平台 | 构建结果 |', '| --- | --- |']
        lines += [f'| {k} | {v["result"]} |' for k,v in results.items()]
        lines += ['', 'Windows：x64 安装程序及便携 ZIP；未配置 Authenticode 签名。', 'macOS：Universal DMG，支持 Apple Silicon 和 Intel；ad-hoc 签名，未公证。', 'Linux：amd64 Debian 安装包。', 'Android：ARM64 release APK；文件名 test 表示临时测试签名，跨构建更新可能需要卸载旧版（卸载会删除本地数据）。', 'iOS：ARM64 未签名 IPA，需要自行签名后安装。', '', '已完成构建及包结构验证，未进行各平台真机运行测试。附带 SHA256SUMS.txt 和 LICENSE.txt。', '', 'Required Notice: Copyright (c) 2026 HGhubX contributors (https://github.com/Minireel/HGhub)', 'License: PolyForm Noncommercial 1.0.0; see LICENSE.txt.', '', 'Source commit: '+os.environ['GITHUB_SHA']]
        Path('release-notes.md').write_text('\n'.join(lines)+'\n')
        NOTES
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "HGhubX ${V} 全平台编译版" --notes-file release-notes.md --prerelease
        fi
